name: Update nixpkgs

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for nixpkgs update
        id: check
        run: |
          current=$(tr -d '[:space:]' < NIXPKGS_REV 2>/dev/null || echo "")
          latest=$(curl -sL https://channels.nixos.org/nixpkgs-unstable/git-revision)

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "No update needed (already at $current)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $current -> $latest"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update NIXPKGS_REV and open PR
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="${{ steps.check.outputs.latest }}"
          current="${{ steps.check.outputs.current }}"
          short_latest="${latest:0:8}"
          branch="update-nixpkgs"

          echo "$latest" > NIXPKGS_REV

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-update the PR branch (keeps a single open PR)
          git checkout -B "$branch"
          git add NIXPKGS_REV
          git commit -m "Update nixpkgs to ${short_latest}"
          git push --force origin "$branch"

          # Create PR if one doesn't already exist on this branch
          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing PR #${existing}"
            gh pr edit "$existing" \
              --title "Update nixpkgs to ${short_latest}" \
              --body "Updates nixpkgs pin from \`${current:0:8}\` to [\`${short_latest}\`](https://github.com/NixOS/nixpkgs/commit/${latest}).

          Merging will trigger a rebuild of all packages in \`packages.txt\`."
          else
            gh pr create \
              --title "Update nixpkgs to ${short_latest}" \
              --body "Updates nixpkgs pin from \`${current:0:8}\` to [\`${short_latest}\`](https://github.com/NixOS/nixpkgs/commit/${latest}).

          Merging will trigger a rebuild of all packages in \`packages.txt\`."
          fi
